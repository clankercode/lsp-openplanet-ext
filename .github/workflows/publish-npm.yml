name: Publish npm

# Called from release.yml after the GitHub Release is created. Gated on
# NPM_TOKEN: if the secret is absent the job logs a notice and exits 0, so
# unconfigured forks can still run the release pipeline end-to-end.
#
# Full publish flow (platform packages first, then the umbrella package with
# --provenance) lands with the npm-lsp package in M2/M3.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  publish:
    name: Publish Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check NPM_TOKEN
        shell: bash
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::notice::NPM_TOKEN not configured; skipping npm publish."
            exit 0
          fi
          echo "::notice::NPM_TOKEN present; full publish pipeline lands in M2/M3."
