name: Nightly

# Disabled by default — enable in M8 by restoring `schedule:` and removing
# `if: false`. The cron trigger stays commented out so it doesn't burn a
# skipped run every day (61 runs observed before this change).
on:
  # schedule:
  #   - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  nightly:
    name: Nightly Build
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - run: echo "Nightly build against openplanet-lsp@main lands in M8."
