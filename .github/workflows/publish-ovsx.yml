name: Publish Open VSX

# Called from release.yml after the GitHub Release is created. Gated on
# OVSX_PAT: if the secret is absent the job logs a notice and exits 0, so
# unconfigured forks can still run the release pipeline end-to-end.
#
# Full publish flow (six platform-specific VSIXs) lands with the vscode-ext
# package in M4/M6.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  publish:
    name: Publish Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check OVSX_PAT
        shell: bash
        env:
          TOKEN: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::OVSX_PAT not configured; skipping Open VSX publish."
            exit 0
          fi
          echo "::notice::OVSX_PAT present; full publish pipeline lands in M4/M6."
