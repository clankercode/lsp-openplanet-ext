name: Publish npm

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true

jobs:
  gate:
    name: Publish Gate
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::notice::NPM_TOKEN not configured; skipping publish."
            exit 0
          fi
          echo "publish-npm pipeline lands in M8."
