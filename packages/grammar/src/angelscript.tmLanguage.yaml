name: AngelScript
scopeName: source.angelscript
fileTypes:
  - as

patterns:
  - include: '#comment-line'
  - include: '#comment-block'
  - include: '#preprocessor'
  - include: '#meta-attribute'
  - include: '#string-triple'
  - include: '#string'
  - include: '#string-single'
  - include: '#keyword-type'
  - include: '#keyword-control'
  - include: '#keyword-declaration'
  - include: '#keyword-modifier'
  - include: '#constant-language'
  - include: '#constant-numeric'
  - include: '#operator-word'
  - include: '#namespace-separator'
  - include: '#operator'
  - include: '#handle'

repository:
  comment-line:
    name: comment.line.double-slash.angelscript
    begin: //
    end: $
    beginCaptures:
      '0':
        name: punctuation.definition.comment.angelscript

  comment-block:
    name: comment.block.angelscript
    begin: /\*
    end: \*/
    beginCaptures:
      '0':
        name: punctuation.definition.comment.begin.angelscript
    endCaptures:
      '0':
        name: punctuation.definition.comment.end.angelscript

  preprocessor:
    patterns:
      - include: '#preproc-include'
      - include: '#preproc-directive'

  # #include "file.as" / #include <file.as> / #include "file" as name
  preproc-include:
    name: meta.preprocessor.include.angelscript
    begin: ^\s*(#\s*include)\b
    end: (?=$)
    beginCaptures:
      '1':
        name: keyword.control.directive.include.angelscript
    patterns:
      - name: string.quoted.double.include.angelscript
        match: '"[^"]*"'
        captures:
          '0':
            name: string.quoted.double.angelscript
      - name: string.quoted.other.lt-gt.include.angelscript
        match: <[^>]*>
      - name: keyword.other.import.as.angelscript
        match: \bas\b

  # #define / #undef / #if / #elif / #else / #endif and unknown #directives
  preproc-directive:
    name: meta.preprocessor.angelscript
    begin: ^\s*(#\s*(?:define|undef|if|elif|else|endif|ifdef|ifndef|pragma|line|error))\b
    end: (?=$)
    beginCaptures:
      '1':
        name: keyword.control.directive.angelscript
    patterns:
      - name: entity.name.function.preprocessor.angelscript
        match: \b[A-Za-z_][A-Za-z0-9_]*\b
      - name: constant.numeric.preprocessor.angelscript
        match: \b\d+\b
      - name: keyword.operator.logical.angelscript
        match: '&&|\|\||!'

  # Openplanet meta attributes: [Setting name="x"], [SettingsTab ...], [Library ...]
  meta-attribute:
    name: meta.attribute.angelscript
    begin: (?<!\w)\[\s*(Setting|SettingHidden|SettingsTab|Library|Hidden|Reserved|DoNotPublish|Deprecated|ScriptedDefault|GlobalDefault)\b
    end: \]
    beginCaptures:
      '1':
        name: entity.name.attribute.angelscript
    patterns:
      - name: string.quoted.double.angelscript
        match: '"[^"]*"'
      - name: variable.parameter.attribute.angelscript
        match: \b[A-Za-z_][A-Za-z0-9_]*(?==)
      - name: punctuation.separator.key-value.angelscript
        match: '='
      - name: constant.language.angelscript
        match: \b(?:true|false)\b

  # Triple-quoted multi-line strings: """...""" (no escape processing)
  string-triple:
    name: string.quoted.triple.angelscript
    begin: '"""'
    end: '"""'
    beginCaptures:
      '0':
        name: punctuation.definition.string.begin.angelscript
    endCaptures:
      '0':
        name: punctuation.definition.string.end.angelscript

  string:
    name: string.quoted.double.angelscript
    begin: '"'
    end: '"'
    beginCaptures:
      '0':
        name: punctuation.definition.string.begin.angelscript
    endCaptures:
      '0':
        name: punctuation.definition.string.end.angelscript
    patterns:
      - name: constant.character.escape.angelscript
        match: '\\.'

  string-single:
    name: string.quoted.single.angelscript
    begin: "'"
    end: "'"
    beginCaptures:
      '0':
        name: punctuation.definition.string.begin.angelscript
    endCaptures:
      '0':
        name: punctuation.definition.string.end.angelscript
    patterns:
      - name: constant.character.escape.angelscript
        match: '\\.'

  keyword-type:
    name: storage.type.angelscript
    match: >-
      \b(void|bool|int|int8|int16|int32|int64|uint|uint8|uint16|uint32|uint64|float|double|string|array|dictionary|auto|function)\b

  keyword-control:
    name: keyword.control.angelscript
    match: >-
      \b(if|else|while|for|do|return|break|continue|switch|case|default|try|catch)\b

  keyword-declaration:
    name: keyword.other.angelscript
    match: >-
      \b(class|interface|enum|namespace|import|funcdef|mixin|cast|this|super)\b

  keyword-modifier:
    name: storage.modifier.angelscript
    match: >-
      \b(shared|abstract|final|override|property|const|private|protected|get|set|in|out|inout)\b

  constant-language:
    name: constant.language.angelscript
    match: '\b(true|false|null)\b'

  # hex 0xFF, binary 0b1010, octal 0o777 (with _ separators), decimals,
  # floats with exponent and/or f/F suffix (incl. lone-suffix forms 25.f and
  # trailing-dot 25.). Branch order matters (most specific first). NOTE: no
  # blanket trailing \b — after a trailing '.' (25.) no word boundary exists,
  # so \b would reject the match; instead each branch guards its own tail.
  constant-numeric:
    name: constant.numeric.angelscript
    match: >-
      (?x)
      \b(?:
        0[xX][0-9a-fA-F_]+
        | 0[bB][01_]+
        | 0[oO][0-7_]+
        | [0-9][0-9_]*\.[fF](?![A-Za-z0-9_])
        | [0-9][0-9_]*\.(?![A-Za-z0-9_])
        | [0-9][0-9_]*\.[eE][+-]?[0-9]+[fF]?
        | (?:[0-9][0-9_]*)?\.[0-9][0-9_]*(?:[eE][+-]?[0-9]+)?[fF]?
        | [0-9][0-9_]*(?:\.[0-9][0-9_]*)?(?:[eE][+-]?[0-9]+)[fF]?
        | [0-9][0-9_]*[fF](?![A-Za-z0-9_])
        | [0-9][0-9_]*\b
      )

  operator-word:
    name: keyword.operator.logical.word.angelscript
    match: '\b(and|or|not|xor|is)\b'

  operator:
    name: keyword.operator.angelscript
    match: '(\+\+|--|<<|>>|<=|>=|==|!=|&&|\|\||[+\-*/%&|^~!<>=?:])'

  # Openplanet namespace access: M::Fast, Meta::ExecutionMode, Net::Http
  namespace-separator:
    name: punctuation.separator.namespace.angelscript
    match: '::'

  # Handle-of / handle type suffix: Class@ obj, @expr, @@attr contexts
  handle:
    name: keyword.operator.handle.angelscript
    match: '@@?'
