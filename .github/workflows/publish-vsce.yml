name: Publish VSCE

# Called from release.yml after the GitHub Release is created. Gated on
# VSCE_PAT: if the secret is absent the job logs a notice and exits 0, so
# unconfigured forks can still run the release pipeline end-to-end.
#
# Full publish flow (six platform-specific VSIXs) lands with the vscode-ext
# package in M4/M6.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  publish:
    name: Publish Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check VSCE_PAT
        shell: bash
        run: |
          if [ -z "${{ secrets.VSCE_PAT }}" ]; then
            echo "::notice::VSCE_PAT not configured; skipping VS Code Marketplace publish."
            exit 0
          fi
          echo "::notice::VSCE_PAT present; full publish pipeline lands in M4/M6."
